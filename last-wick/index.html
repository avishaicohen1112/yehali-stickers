<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>הפתיל האחרון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate"><div>⟳</div><p>סובב את המכשיר לרוחב</p></div>
<div id="touch" class="hidden">
  <div id="stick"><div id="knob"></div></div>
  <div id="tbtns">
    <button data-k="focus" data-label="ריפוי / קסם" class="tb t-focus">✦</button>
    <button data-k="dash" data-label="זינוק" class="tb t-dash">»</button>
    <button data-k="attack" data-label="מכה" class="tb t-attack">⚔</button>
    <button data-k="jump" data-label="קפיצה" class="tb t-jump">▲</button>
  </div>
  <div id="ttop">
    <button data-k="dance" data-label="ריקוד" class="tb t-small">♪</button>
    <button data-k="map" data-label="מפה" class="tb t-small">🗺</button>
    <button data-k="pause" data-label="תפריט" class="tb t-small">❚❚</button>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/util.js"></script>
<script src="js/text.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/assets.js"></script>
<script src="js/fx.js"></script>
<script src="js/puppet.js"></script>
<script src="js/scenery.js"></script>
<script src="js/wind.js"></script>
<script src="js/world.js"></script>
<script src="js/player.js"></script>
<script src="js/enemies.js"></script>
<script src="js/bosses.js"></script>
<script src="js/giants.js"></script>
<script src="js/objects.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
